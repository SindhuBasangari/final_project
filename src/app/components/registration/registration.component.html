<div class="auth-container">
  <h2>Registration</h2>

  <div *ngIf="registrationSuccess; else registrationFormContent" class="success-message">
    <p>Registration successful! <a routerLink="/login">Click here to login.</a></p>
  </div>

  <ng-template #registrationFormContent>
    <form [formGroup]="registrationForm" (ngSubmit)="register()">
      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" formControlName="username" required>
        <div *ngIf="registrationForm.get('username')?.invalid && (registrationForm.get('username')?.dirty || registrationForm.get('username')?.touched)">
          <small class="error-message" *ngIf="registrationForm.get('username')?.errors?.['required']">Username is required.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" formControlName="email" required>
        <div *ngIf="registrationForm.get('email')?.invalid && (registrationForm.get('email')?.dirty || registrationForm.get('email')?.touched)">
          <small class="error-message" *ngIf="registrationForm.get('email')?.errors?.['required']">Email is required.</small>
          <small class="error-message" *ngIf="registrationForm.get('email')?.errors?.['email']">Please enter a valid email address.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" formControlName="password" required>
        <div *ngIf="registrationForm.get('password')?.invalid && (registrationForm.get('password')?.dirty || registrationForm.get('password')?.touched)">
          <small class="error-message" *ngIf="registrationForm.get('password')?.errors?.['required']">Password is required.</small>
          <small class="error-message" *ngIf="registrationForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters long.</small>
        </div>
      </div>

      <button type="submit" [disabled]="registrationForm.invalid">Register</button>
    </form>

    <p>Already have an account? <a routerLink="/login">Login here</a></p>
  </ng-template>
</div>
